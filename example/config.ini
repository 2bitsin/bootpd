; bootpd example configuration
; Lines starting with ';' are comments, values may be quoted with "".

; ---- Global settings ---------------------------------------------------------

v4_bind_address         = 10.0.0.1      ; Bind to the adapter with this IP address (0.0.0.0 = all adapters)
dhcp_enabled            = true          ; Set to false when another DHCP server is in charge
dhcp_listen_port        = 67            ; The port to listen on for DHCP/BOOTP requests
tftp_enabled            = true          ; Set to false to only run the DHCP server
tftp_listen_port        = 69            ; The port to listen on for TFTP requests
tftp_base_dir           = ./            ; Root directory for TFTP requests, nothing outside of it is served

; ---- Clients -----------------------------------------------------------------
; One section per machine, named after its MAC address (00-1c-7e-35-ed-20 or
; 00:1C:7E:35:ED:20, case does not matter). Unknown machines are ignored.

[00-1c-7e-35-ed-20]
boot_file_name          = hello.bin     ; The file to boot from (the NBP), relative to tftp_base_dir
v4_your_address         = 10.0.0.2      ; The IP address to assign to the client
v4_server_address       = 10.0.0.1      ; The IP address of the TFTP server the client boots from (this computer)
v4_subnet_mask          = 255.0.0.0     ; The subnet mask of this ad hoc network
v4_router_address       = 10.0.0.1      ; The default gateway (defaults to v4_server_address)
v4_dhcp_server_address  = 10.0.0.1      ; The DHCP server identifier (defaults to v4_server_address)
v4_log_server_address   = 10.0.0.1      ; The log server (defaults to v4_server_address)
server_host_name        = home.2bits.in ; Sent in the 'sname' field and as the host name option
domain_name             = home.2bits.in ; The domain name option (defaults to localhost)
address_lease_time      = 172800        ; Lease time in seconds
address_renewal_time    = 86400         ; Renewal (T1) time in seconds
address_rebinding_time  = 138240        ; Rebinding (T2) time in seconds
