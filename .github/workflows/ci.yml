name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC)
            os: ubuntu-24.04
            profile_args: -s compiler.cppstd=20 -o "&:warnings_as_errors=True"
          - name: Linux (Clang)
            os: ubuntu-24.04
            profile_args: -o "&:warnings_as_errors=True" -s compiler.cppstd=20 -s compiler=clang -s compiler.version=18 -s compiler.libcxx=libstdc++11 -c 'tools.build:compiler_executables={"c":"clang-18","cpp":"clang++-18"}' 
          - name: Windows (MSVC)
            os: windows-2022
            profile_args: -s compiler.cppstd=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: |
          pip install conan
          conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.os }}-${{ matrix.name }}-${{ hashFiles('conanfile.py') }}

      - name: Build and test
        shell: bash
        run: conan build . --build=missing ${{ matrix.profile_args }}
